<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1728">
  <title>SMMCPAN | الخدمات</title>
  <style>
    :root { color-scheme: light; --ink:#132238; --muted:#64748b; --bg:#f4f7fb; --card:#fff; --line:#e7edf5; --brand:#2563eb; --brand-dark:#1745ad; --soft:#eaf1ff; --ok:#087443; --ok-bg:#e8f8ef; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Tahoma,Arial,sans-serif; }
    .topbar { background:linear-gradient(135deg,#0d1728,#193a73); color:#fff; padding:28px 18px 46px; }
    .topbar-inner, main { width:min(100% - 32px, 1060px); margin:auto; }
    .brand { display:flex; align-items:center; gap:12px; }
    .logo { display:grid; place-items:center; width:46px; height:46px; border-radius:14px; background:#fff; color:var(--brand); font-weight:900; font-size:20px; }
    .brand strong { display:block; font-size:18px; }
    .brand small { color:#c7d7f6; }
    .hero { margin-top:28px; max-width:670px; }
    .hero h1 { margin:0 0 12px; font-size:clamp(28px,5vw,44px); line-height:1.2; }
    .hero p { margin:0; color:#d8e3f7; line-height:1.8; }
    main { margin-top:-24px; padding-bottom:38px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:22px; box-shadow:0 14px 35px #13223812; }
    .controls { display:flex; gap:12px; align-items:center; padding:16px; }
    input,button { min-height:46px; border-radius:12px; font:inherit; }
    input { flex:1; min-width:0; padding:0 14px; border:1px solid #d8e1ef; outline:none; }
    input:focus { border-color:var(--brand); box-shadow:0 0 0 3px #2563eb22; }
    button { border:0; padding:0 20px; color:#fff; background:var(--brand); font-weight:700; cursor:pointer; transition:.2s; }
    button:hover { background:var(--brand-dark); }
    button:disabled { opacity:.65; cursor:wait; }
    .summary { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:0 20px 18px; color:var(--muted); font-size:14px; }
    .status { display:inline-flex; align-items:center; gap:7px; color:var(--ok); background:var(--ok-bg); border-radius:99px; padding:7px 10px; }
    .status::before { content:''; width:7px; height:7px; border-radius:50%; background:#16a05d; }
    #services { padding:0 16px 16px; }
    .empty { padding:48px 20px; text-align:center; color:var(--muted); }
    .service { padding:18px 4px; border-top:1px solid var(--line); }
    .service-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    .service h2 { margin:0 0 8px; font-size:17px; line-height:1.5; }
    .id { flex:none; color:var(--brand); background:var(--soft); padding:7px 10px; border-radius:9px; font-size:12px; font-weight:700; }
    .category { color:var(--muted); font-size:13px; margin-bottom:14px; }
    .facts { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .fact { padding:11px; background:#f8fafc; border-radius:11px; }
    .fact span { display:block; color:var(--muted); font-size:12px; margin-bottom:5px; }
    .fact strong { font-size:14px; }
    .notice { margin:0 16px 16px; padding:12px 14px; border-radius:12px; background:#fff8e5; color:#825900; font-size:13px; line-height:1.6; }
    footer { text-align:center; color:var(--muted); font-size:12px; padding:20px; }
    @media (max-width:600px) { .controls { display:block; } .controls button { width:100%; margin-top:10px; } .summary { align-items:flex-start; flex-direction:column; } .facts { grid-template-columns:1fr; } .topbar { padding-bottom:42px; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand"><div class="logo">S</div><div><strong>SMMCPAN</strong><small>خدمات التسويق الرقمي</small></div></div>
      <div class="hero"><h1>اكتشف خدماتك بسهولة</h1><p>كتالوج خدمات سريع وواضح داخل Telegram، مع بيانات محدثة مباشرة من SMMCPAN.</p></div>
    </div>
  </header>
  <main>
    <section class="card">
      <div class="controls"><input id="search" type="search" placeholder="ابحث باسم الخدمة أو التصنيف..." aria-label="البحث في الخدمات"><button id="load" type="button">تحميل الخدمات</button></div>
      <div id="notice" class="notice" hidden></div>
      <div class="summary"><span id="count">لم يتم تحميل الخدمات بعد</span><span class="status">متصل بالخادم</span></div>
      <div id="services" class="empty">اضغط «تحميل الخدمات» لعرض الكتالوج.</div>
    </section>
    <footer>واجهة قراءة فقط · مفتاح SMMCPAN محمي داخل الخادم</footer>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const list = document.getElementById('services');
    const search = document.getElementById('search');
    const load = document.getElementById('load');
    const count = document.getElementById('count');
    const notice = document.getElementById('notice');
    let services = [];
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const number = (value) => Number(value || 0).toLocaleString('ar-EG');
    function message(text, error = false) { notice.hidden = !text; notice.textContent = text || ''; notice.style.background = error ? '#fff0f0' : '#fff8e5'; notice.style.color = error ? '#a32626' : '#825900'; }
    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      const visible = services.filter((s) => `${s.name} ${s.category} ${s.service}`.toLocaleLowerCase().includes(query));
      count.textContent = `${visible.length.toLocaleString('ar-EG')} خدمة`;
      if (!visible.length) { list.className = 'empty'; list.textContent = services.length ? 'لا توجد نتائج مطابقة.' : 'لا توجد خدمات متاحة حاليًا.'; return; }
      list.className = '';
      list.innerHTML = visible.map((s) => `<article class="service"><div class="service-head"><div><h2>${esc(s.name)}</h2><div class="category">التصنيف: ${esc(s.category)}</div></div><span class="id">#${esc(s.service)}</span></div><div class="facts"><div class="fact"><span>السعر الأصلي</span><strong>${number(s.price)}</strong></div><div class="fact"><span>الحد الأدنى</span><strong>${number(s.min)}</strong></div><div class="fact"><span>الحد الأقصى</span><strong>${number(s.max)}</strong></div></div></article>`).join('');
    }
    async function loadServices() {
      load.disabled = true; load.textContent = 'جارٍ التحميل...'; list.className = 'empty'; list.textContent = 'جارٍ تحميل الخدمات من SMMCPAN...'; message('');
      try { const response = await fetch('/api/services'); const data = await response.json(); if (!response.ok) throw new Error(data.message || 'تعذر تحميل الخدمات'); services = Array.isArray(data.services) ? data.services : []; render(); message(`تم تحديث الكتالوج: ${services.length.toLocaleString('ar-EG')} خدمة.`); }
      catch (error) { list.className = 'empty'; list.textContent = 'تعذر تحميل الخدمات.'; count.textContent = 'فشل التحميل'; message(error.message, true); }
      finally { load.disabled = false; load.textContent = 'تحميل الخدمات'; }
    }
    load.addEventListener('click', loadServices); search.addEventListener('input', render);
  </script>
</body>
</html>
