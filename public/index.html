<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>خدمات التواصل</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 18px; background: #f4f7fb; color: #172033; font-family: Tahoma, Arial, sans-serif; }
    main { width: min(100%, 680px); margin: 0 auto; }
    header, .panel { background: #fff; border: 1px solid #e5eaf2; border-radius: 18px; padding: 20px; margin-bottom: 14px; box-shadow: 0 8px 25px #1423440d; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0; color: #5d6780; line-height: 1.7; }
    .tag { display: inline-block; margin-bottom: 12px; padding: 7px 11px; border-radius: 99px; color: #2864df; background: #edf3ff; font-size: 12px; font-weight: bold; }
    .toolbar { display: flex; gap: 8px; margin-top: 16px; }
    input, button { min-height: 44px; border-radius: 11px; font: inherit; }
    input { flex: 1; border: 1px solid #dce3ef; padding: 0 12px; }
    button { border: 0; padding: 0 16px; color: #fff; background: #2864df; font-weight: bold; cursor: pointer; }
    button.secondary { background: #eef3fb; color: #2864df; }
    .notice { margin-top: 12px; color: #7a4b00; background: #fff6df; border-radius: 10px; padding: 10px; font-size: 13px; }
    .service { border-top: 1px solid #edf0f5; padding: 16px 0; }
    .service:first-child { border-top: 0; }
    .service h3 { margin: 0 0 8px; font-size: 16px; }
    .service small { display: block; color: #69758c; line-height: 1.8; }
    .empty { color: #69758c; text-align: center; padding: 20px 0; }
    @media (max-width: 480px) { .toolbar { flex-direction: column; } button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="tag">Telegram Mini App</span>
      <h1>الخدمات المتاحة</h1>
      <p>الخدمات معروضة مباشرة من SMMCPAN، والأسعار الظاهرة تشمل زيادة 10%.</p>
      <div class="toolbar"><button id="load">تحميل الخدمات</button></div>
      <div id="message" class="notice" hidden></div>
    </header>
    <section class="panel">
      <div class="toolbar"><input id="search" placeholder="ابحث عن خدمة أو تصنيف" /><button id="refresh" class="secondary">تحديث</button></div>
      <div id="services" class="empty">اضغط «تحميل الخدمات» لعرض الخدمات الحقيقية.</div>
    </section>
  </main>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
    const list = document.getElementById('services');
    const message = document.getElementById('message');
    const search = document.getElementById('search');
    let allServices = [];
    function showMessage(text) { message.hidden = !text; message.textContent = text || ''; }
    function render() {
      const q = search.value.trim().toLowerCase();
      const items = allServices.filter(s => `${s.name} ${s.category} ${s.type}`.toLowerCase().includes(q));
      if (!items.length) { list.className = 'empty'; list.textContent = 'لا توجد نتائج.'; return; }
      list.className = '';
      list.innerHTML = items.map(s => `<article class="service"><h3>${escapeHtml(s.name)}</h3><small>التصنيف: ${escapeHtml(s.category || 'عام')}</small><small>السعر بعد الزيادة: ${escapeHtml(String(s.rate))} لكل 1000</small><small>الحد الأدنى: ${escapeHtml(String(s.min))} — الحد الأقصى: ${escapeHtml(String(s.max))}</small></article>`).join('');
    }
    function escapeHtml(value) { return value.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    async function loadServices() {
      list.className = 'empty'; list.textContent = 'جاري تحميل الخدمات...'; showMessage('');
      try { const r = await fetch('/api/services'); const data = await r.json(); if (!r.ok) throw new Error(data.message || 'تعذر تحميل الخدمات'); allServices = data.services || []; render(); }
      catch (e) { list.className = 'empty'; list.textContent = 'تعذر تحميل الخدمات.'; showMessage(e.message); }
    }
    document.getElementById('load').addEventListener('click', loadServices);
    document.getElementById('refresh').addEventListener('click', loadServices);
    search.addEventListener('input', render);
  </script>
</body>
</html>
